name: Build blocksize-capital adapter

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (suffix). Final tag is 2.6.6-<tag>'
        required: true
        default: 'sharded'
  push:
    branches:
      - feat/blocksize-capital-ws-sharding
    paths:
      - 'packages/sources/blocksize-capital/**'
      - 'Dockerfile'
      - '.github/workflows/build-blocksize-capital.yml'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/blocksize-capital-adapter

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            suffix="${{ inputs.tag }}"
          else
            suffix="${GITHUB_SHA::7}"
          fi
          echo "tag=2.6.6-${suffix}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            location=packages/sources/blocksize-capital
            package=@chainlink/blocksize-capital-adapter
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed: ${IMAGE}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull with: docker pull ${IMAGE}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
